[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "student-retention-system"
version = "0.1.0"
description = "End-to-end ML system predicting student term-over-term persistence (explainability, API, dashboard), plus an admissions-review pipeline (transcript extraction, multi-agent validation, handbook-rules checking, human-in-the-loop decisioning). Built on synthetic, de-identified data for portfolio/educational purposes."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "scikit-learn>=1.6",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "optuna>=4.0",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "streamlit>=1.33",
    "pydantic>=2.6",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "google-cloud-storage>=2.10",
    "google-genai>=0.3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "kaleido>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI's Depends(...) in a default argument is the standard idiom, not a bug
    "UP045",  # Optional[X] kept (not X | None) for consistency with this project's Python 3.9 floor
    "UP006",  # list[X]/dict[X] as a *runtime* annotation (SQLAlchemy/Pydantic eval annotations at
    "UP035",  # class-definition time) fails on Python 3.9 — List[X]/Dict[X] from typing kept instead
    "FA100",  # admissions_platform/models.py can't use `from __future__ import annotations` even
              # though that would make `X | None` parse: SQLAlchemy's declarative mapper evals
              # annotations at class-definition time regardless, and X|None genuinely fails on
              # Python 3.9 at eval time, future-annotations or not
    "BLE001", # a few modules deliberately catch a blind Exception to degrade gracefully
              # (missing model file, xgboost native-library load failure) — documented at each site
]
